<link rel="stylesheet" href="/static/style.css" type="text/css">

{% block body %}
<div class="login">
  <div class="login-screen">
    <div class="app-title">
      <h1>Create Account</h1>
    </div>
    
    {% with messages = get_flashed_messages() %}
      {% if messages %}
        <p class="flash-message">{{ messages[0] }}</p>
      {% endif %}
    {% endwith %}

    <form action="/signup" method="POST">
      <div class="login-form">
        <div class="control-group">
          <input type="text" class="login-field" placeholder="Choose Username" name="username" required>
        </div>
        <div class="control-group">
          <input type="password" class="login-field" placeholder="Choose Password" name="password" required>
        </div>
        <input type="submit" value="Sign Up" class="btn btn-primary btn-large btn-block">
        <p><a href="{{ url_for('home') }}">Already have an account? Log in</a></p>
      </div>
    </form>
  </div>
</div>
{% endblock %}
